# The bot's backend: every 30 minutes, pick up new notes from Telegram, screen and draft them,
# reply in the channel, and commit the saved drafts. It only reads notes and replies in chat;
# nothing here posts or schedules content anywhere.
name: poll-notes

on:
  schedule:
    - cron: '*/30 * * * *'   # GitHub may start scheduled runs a few minutes late
  workflow_dispatch:          # "Run workflow" button for an immediate pass

concurrency:
  group: poll-notes
  cancel-in-progress: false

permissions:
  contents: write             # to commit drafts/

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/poll.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
          DRAFTS_DIR: drafts
      - name: Commit new drafts
        if: always()
        run: |
          git add drafts/ 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git -c user.name="draft-bot" -c user.email="draft-bot@users.noreply.github.com" commit -m "Save drafts awaiting review"
          git push
